<text x="48" y="338" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9aa4b2" text-anchor="start" font-weight="400">Line In: jack 6.35mm TS mono, tip = segnale, sleeve = GND (massa in comune).</text>
<text x="48" y="358" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9aa4b2" text-anchor="start" font-weight="400">Line In è mono: TŒRN campiona il canale L. L'uscita è il jack cuffie stereo della scheda.</text>
<text x="48" y="378" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9aa4b2" text-anchor="start" font-weight="400">Ingresso di default = LINE IN (registrazione). Nessuna modifica al firmware.</text>
