<text x="28" y="40" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#e6edf3" text-anchor="start" font-weight="700">Audio: Line In 6.35mm + uscita cuffie</text>
<text x="28" y="64" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#9aa4b2" text-anchor="start" font-weight="400">Il jack Line In si collega al pad LINE IN L dell'Audio Shield (non a un GPIO).</text>
