<text x="153.0" y="160" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#9aa4b2" text-anchor="middle" font-weight="400">SGTL5000</text>
<rect x="166" y="193" width="84" height="24" rx="5" ry="5" fill="#0d1117" stroke="#2ea44f" stroke-width="1"/>
