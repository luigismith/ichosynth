<text x="554" y="269" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#e6edf3" text-anchor="start" font-weight="700">Cuffie 3.5mm · uscita</text>
<text x="722" y="269" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#9aa4b2" text-anchor="end" font-weight="400">(integrato)</text>
